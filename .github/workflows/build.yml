name: Build ALG App Store

on:
  push:
    branches: [ "main", "qt6/c++" ]
  pull_request:
    branches: [ "main", "qt6/c++" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          qt6-base-dev \
          qt6-tools-dev \
          qt6-tools-dev-tools \
          libalpm-dev \
          libarchive-dev \
          libcurl4-openssl-dev \
          pkg-config
    
    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake ..
    
    - name: Build
      run: |
        cd build
        make -j$(nproc)
    
    - name: Check build artifacts
      run: |
        ls -lh build/alg-app-store
        file build/alg-app-store
    
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: alg-app-store
        path: build/alg-app-store
        retention-days: 7
